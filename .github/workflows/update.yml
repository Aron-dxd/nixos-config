name: "Update flake inputs"

on:
  schedule:
    - cron: "30 0 * * 5"
  workflow_dispatch:

jobs:
  update-and-check:
    name: "Update and evaluate flake"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Update flake.lock
        run: nix flake update --accept-flake-config

      - name: Check flake health
        uses: DeterminateSystems/flake-checker-action@v9

      - name: Build hiroshima config
        run: |
          nix build .#nixosConfigurations.hiroshima.config.system.build.toplevel \
            --no-link \
            --show-trace \
            --accept-flake-config

      - name: Open PR with updated flake.lock
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "update flake.lock"
          title: "update flake inputs"
          body: "Automated flake input update. Build passed."
          branch: flake-update/automated
          delete-branch: true